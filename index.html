<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <title>Nano Banana 图生图工作流 V2</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }
        body {
            overscroll-behavior: none;
        }
        input, textarea, select, button {
            font-size: 16px !important;
        }
        .image-grid-item {
            position: relative;
            cursor: pointer;
            transition: all 0.3s;
        }
        .image-grid-item:hover {
            transform: scale(1.05);
        }
        .image-grid-item.selected {
            ring: 3px solid #3b82f6;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        function App() {
            // 基础状态
            const [apiKey, setApiKey] = useState('sk-6e92f2331cc84d4b81688f494260407c');
            const [initialImage, setInitialImage] = useState(null);
            const [maxRetries, setMaxRetries] = useState(10);
            const [nodes, setNodes] = useState([
                { 
                    id: 1, 
                    prompt: '', 
                    model: 'nano-banana-pro',
                    imageSize: '1K',
                    aspectRatio: 'auto',
                    numImages: 1,
                    selectedInputImage: null,
                    status: 'pending', 
                    results: [],
                    progress: 0, 
                    error: '',
                    retryCount: 0
                }
            ]);
            
            // UI状态
            const [isRunning, setIsRunning] = useState(false);
            const [currentRunningNode, setCurrentRunningNode] = useState(null);
            const [isStopping, setIsStopping] = useState(false);
            const [previewImage, setPreviewImage] = useState(null);
            const [showDebugLog, setShowDebugLog] = useState(false);
            const [debugLogs, setDebugLogs] = useState([]);
            const [showPromptLibrary, setShowPromptLibrary] = useState(false);
            const [currentNodeForPrompt, setCurrentNodeForPrompt] = useState(null);
            
            // 提示词库
            const [savedPrompts, setSavedPrompts] = useState(() => {
                try {
                    const saved = localStorage.getItem('nanoBananaPrompts');
                    return saved ? JSON.parse(saved) : [];
                } catch {
                    return [];
                }
            });
            
            const fileInputRef = useRef(null);
            const stopFlagRef = useRef(false);

            // 模型选项
            const modelOptions = [
                { value: 'nano-banana-fast', label: 'Fast (快速)' },
                { value: 'nano-banana-standard', label: 'Standard (标准)' },
                { value: 'nano-banana-pro', label: 'Pro (专业)' },
                { value: 'nano-banana-pro-vt', label: 'Pro VT' },
                { value: 'nano-banana-pro-cl', label: 'Pro CL' },
                { value: 'nano-banana-pro-vip', label: 'Pro VIP' },
                { value: 'nano-banana-pro-4k-vip', label: 'Pro 4K VIP' }
            ];

            // 分辨率选项
            const allSizeOptions = {
                'nano-banana-fast': ['1K'],
                'nano-banana-standard': ['1K', '2K'],
                'nano-banana-pro': ['1K', '2K'],
                'nano-banana-pro-vt': ['1K', '2K', '4K'],
                'nano-banana-pro-cl': ['1K', '2K', '4K'],
                'nano-banana-pro-vip': ['1K', '2K', '4K'],
                'nano-banana-pro-4k-vip': ['4K']
            };

            const getAvailableSizes = (model) => {
                return allSizeOptions[model] || ['1K'];
            };

            // 图片比例选项
            const aspectRatioOptions = [
                { value: 'auto', label: 'Auto (自动)' },
                { value: '1:1', label: '1:1 (方形)' },
                { value: '16:9', label: '16:9 (横屏)' },
                { value: '9:16', label: '9:16 (竖屏)' },
                { value: '4:3', label: '4:3' },
                { value: '3:4', label: '3:4' },
                { value: '21:9', label: '21:9 (超宽)' },
                { value: '9:21', label: '9:21 (超高)' },
                { value: '3:2', label: '3:2' },
                { value: '2:3', label: '2:3' },
                { value: '5:4', label: '5:4' }
            ];

            // 调试日志
            const addLog = (message) => {
                const timestamp = new Date().toLocaleTimeString();
                const logEntry = `[${timestamp}] ${message}`;
                console.log(logEntry);
                setDebugLogs(prev => [...prev, logEntry].slice(-100));
            };

            // 提示词库管理
            const savePromptToLibrary = (prompt) => {
                if (!prompt.trim()) {
                    alert('提示词不能为空');
                    return;
                }
                const newPrompts = [...savedPrompts, { id: Date.now(), text: prompt.trim() }];
                setSavedPrompts(newPrompts);
                localStorage.setItem('nanoBananaPrompts', JSON.stringify(newPrompts));
                alert('已保存到提示词库');
            };

            const deletePrompt = (id) => {
                if (confirm('确定删除这个提示词？')) {
                    const newPrompts = savedPrompts.filter(p => p.id !== id);
                    setSavedPrompts(newPrompts);
                    localStorage.setItem('nanoBananaPrompts', JSON.stringify(newPrompts));
                }
            };

            const loadPromptToNode = (nodeId, promptText) => {
                updateNodePrompt(nodeId, promptText);
                setShowPromptLibrary(false);
                setCurrentNodeForPrompt(null);
            };

            // 停止工作流
            const stopWorkflow = () => {
                addLog('🛑 用户请求停止...');
                setIsStopping(true);
                stopFlagRef.current = true;
            };

            // 节点管理
            const addNode = () => {
                const newNode = {
                    id: Date.now(),
                    prompt: '',
                    model: 'nano-banana-pro',
                    imageSize: '1K',
                    aspectRatio: 'auto',
                    numImages: 1,
                    selectedInputImage: null,
                    status: 'pending',
                    results: [],
                    progress: 0,
                    error: '',
                    retryCount: 0
                };
                setNodes([...nodes, newNode]);
            };

            const removeNode = (id) => {
                if (nodes.length > 1) {
                    setNodes(nodes.filter(node => node.id !== id));
                }
            };

            const updateNodePrompt = (id, prompt) => {
                setNodes(nodes.map(node =>
                    node.id === id ? { ...node, prompt } : node
                ));
            };

            const updateNodeModel = (id, model) => {
                setNodes(nodes.map(node => {
                    if (node.id === id) {
                        const availableSizes = getAvailableSizes(model);
                        const newImageSize = availableSizes.includes(node.imageSize) 
                            ? node.imageSize 
                            : availableSizes[0];
                        return { ...node, model, imageSize: newImageSize };
                    }
                    return node;
                }));
            };

            const updateNodeImageSize = (id, imageSize) => {
                setNodes(nodes.map(node =>
                    node.id === id ? { ...node, imageSize } : node
                ));
            };

            const updateNodeAspectRatio = (id, aspectRatio) => {
                setNodes(nodes.map(node =>
                    node.id === id ? { ...node, aspectRatio } : node
                ));
            };

            const updateNodeNumImages = (id, numImages) => {
                setNodes(nodes.map(node => 
                    node.id === id ? { ...node, numImages: parseInt(numImages) } : node
                ));
            };

            const updateNodeSelectedInput = (id, imageUrl) => {
                setNodes(nodes.map(node => 
                    node.id === id ? { ...node, selectedInputImage: imageUrl } : node
                ));
            };

            // 图片处理
            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        setInitialImage(event.target.result);
                    };
                    reader.readAsDataURL(file);
                }
            };

            const resizeImageTo720p = async (imageUrl) => {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.crossOrigin = 'anonymous';
                    img.onload = () => {
                        const maxDimension = 1280;
                        let width = img.width;
                        let height = img.height;

                        if (width > maxDimension || height > maxDimension) {
                            if (width > height) {
                                height = (height / width) * maxDimension;
                                width = maxDimension;
                            } else {
                                width = (width / height) * maxDimension;
                                height = maxDimension;
                            }
                        }

                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        resolve(canvas.toDataURL('image/jpeg', 0.9));
                    };
                    img.onerror = reject;
                    img.src = imageUrl;
                });
            };

            const downloadImage = async (url, filename) => {
                try {
                    addLog(`[下载] 开始下载: ${filename}`);
                    const response = await fetch(url);
                    const blob = await response.blob();
                    const blobUrl = URL.createObjectURL(blob);
                    
                    const a = document.createElement('a');
                    a.href = blobUrl;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(blobUrl);
                    
                    addLog(`[下载] ✅ 下载成功: ${filename}`);
                } catch (error) {
                    addLog(`[下载] ⚠️ 下载失败: ${error.message}`);
                }
            };

            // API调用
            const callNanoBanana = async (prompt, imageUrl, model, imageSize, aspectRatio) => {
                addLog(`[API调用] 开始请求...`);
                addLog(`[API调用] 模型: ${model}, 分辨率: ${imageSize}, 比例: ${aspectRatio}`);
                addLog(`[API调用] 提示词: ${prompt.substring(0, 50)}...`);
                
                const response = await fetch('https://grsaiapi.com/v1/draw/nano-banana', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: model,
                        prompt: prompt,
                        urls: [imageUrl],
                        aspectRatio: aspectRatio,
                        imageSize: imageSize,
                        webHook: '-1',
                        shutProgress: false
                    })
                });

                const result = await response.json();
                
                if (result.code === 0) {
                    addLog(`[API调用] ✅ 成功获取任务ID: ${result.data.id}`);
                    return result.data.id;
                } else {
                    addLog(`[API调用] ❌ 失败: ${result.msg}`);
                    throw new Error(result.msg || '请求失败');
                }
            };

            // 轮询结果
            const pollResult = async (taskId, nodeId) => {
                return new Promise((resolve, reject) => {
                    let pollCount = 0;
                    const maxPollCount = 300;
                    
                    const interval = setInterval(async () => {
                        if (stopFlagRef.current) {
                            addLog(`[轮询] 🛑 检测到停止信号，终止轮询`);
                            clearInterval(interval);
                            reject(new Error('用户停止'));
                            return;
                        }
                        
                        pollCount++;
                        
                        try {
                            const response = await fetch('https://grsaiapi.com/v1/draw/result', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json',
                                    'Authorization': `Bearer ${apiKey}`
                                },
                                body: JSON.stringify({ id: taskId })
                            });

                            const result = await response.json();
                            
                            if (result.code === 0) {
                                const data = result.data;
                                
                                const statusChanged = data.status !== 'running';
                                if (pollCount % 5 === 1 || statusChanged) {
                                    addLog(`[轮询 ${pollCount}] 状态: ${data.status}, 进度: ${data.progress || 0}%`);
                                }
                                
                                setNodes(prevNodes => prevNodes.map(node =>
                                    node.id === nodeId ? {
                                        ...node,
                                        progress: data.progress || 0,
                                        status: data.status === 'succeeded' ? 'completed' : 
                                               data.status === 'failed' ? 'failed' : 'running'
                                    } : node
                                ));

                                if (data.status === 'succeeded') {
                                    addLog(`[轮询 ${pollCount}] ✅ 生成成功!`);
                                    clearInterval(interval);
                                    resolve(data.results[0]); // 返回单个结果
                                } else if (data.status === 'failed') {
                                    addLog(`[轮询 ${pollCount}] ❌ 生成失败: ${data.failure_reason || data.error}`);
                                    clearInterval(interval);
                                    reject(new Error(data.failure_reason || data.error || '生成失败'));
                                }
                            } else {
                                if (pollCount % 10 === 1) {
                                    addLog(`[轮询 ${pollCount}] 等待任务准备...`);
                                }
                            }
                            
                            if (pollCount >= maxPollCount) {
                                addLog(`[轮询 ${pollCount}] ⏱️ 轮询超时（5分钟）`);
                                clearInterval(interval);
                                reject(new Error('轮询超时（5分钟）'));
                            }
                        } catch (error) {
                            if (pollCount % 10 === 1) {
                                addLog(`[轮询 ${pollCount}] ⚠️ 轮询错误: ${error.message}`);
                            }
                        }
                    }, 1000);
                });
            };

            // 执行单个节点
            const runNode = async (nodeIndex) => {
                if (!apiKey) {
                    alert('请输入 API Key');
                    return;
                }
                
                const node = nodes[nodeIndex];
                
                // 确定输入图片
                let inputImage;
                if (nodeIndex === 0) {
                    if (!initialImage) {
                        alert('请先上传初始图片');
                        return;
                    }
                    addLog(`[节点 ${nodeIndex + 1}] 使用初始图片作为输入`);
                    inputImage = await resizeImageTo720p(initialImage);
                } else {
                    if (!node.selectedInputImage) {
                        alert(`节点${nodeIndex + 1}：请先选择输入图片`);
                        return;
                    }
                    addLog(`[节点 ${nodeIndex + 1}] 使用选中的图片作为输入`);
                    inputImage = await resizeImageTo720p(node.selectedInputImage);
                }
                
                if (!node.prompt.trim()) {
                    alert(`节点${nodeIndex + 1}：请输入提示词`);
                    return;
                }
                
                addLog(`\n[节点 ${nodeIndex + 1}] ========== 开始处理 ==========`);
                addLog(`[节点 ${nodeIndex + 1}] 生成数量: ${node.numImages} (并行发送)`);
                
                setIsRunning(true);
                setCurrentRunningNode(nodeIndex);
                setIsStopping(false);
                stopFlagRef.current = false;
                
                let success = false;
                let retryCount = 0;
                
                while (!success && retryCount <= maxRetries) {
                    if (stopFlagRef.current) {
                        addLog(`[节点 ${nodeIndex + 1}] 🛑 检测到停止信号`);
                        setNodes(prevNodes => prevNodes.map((n, idx) =>
                            idx === nodeIndex ? { ...n, status: 'failed', error: '已停止' } : n
                        ));
                        break;
                    }
                    
                    try {
                        if (retryCount > 0) {
                            addLog(`[节点 ${nodeIndex + 1}] 🔄 第 ${retryCount} 次重试 (重新发送${node.numImages}个请求)...`);
                        }
                        
                        setNodes(prevNodes => prevNodes.map((n, idx) =>
                            idx === nodeIndex ? {
                                ...n,
                                status: 'running',
                                progress: 0,
                                retryCount,
                                error: retryCount > 0 ? `重试中 (${retryCount}/${maxRetries})` : ''
                            } : n
                        ));
                        
                        // 🚀 一次性并行发送所有请求
                        addLog(`[节点 ${nodeIndex + 1}] 🚀 并行发送 ${node.numImages} 个请求...`);
                        
                        const taskPromises = [];
                        for (let i = 0; i < node.numImages; i++) {
                            const taskPromise = callNanoBanana(
                                node.prompt,
                                inputImage,
                                node.model,
                                node.imageSize,
                                node.aspectRatio
                            ).then(taskId => {
                                addLog(`[节点 ${nodeIndex + 1}] 📋 请求 ${i + 1}/${node.numImages} 已提交，任务ID: ${taskId}`);
                                return { taskId, index: i };
                            }).catch(error => {
                                addLog(`[节点 ${nodeIndex + 1}] ❌ 请求 ${i + 1}/${node.numImages} 提交失败: ${error.message}`);
                                return { error, index: i };
                            });
                            taskPromises.push(taskPromise);
                        }
                        
                        // 等待所有请求提交完成
                        const taskResults = await Promise.all(taskPromises);
                        
                        // 筛选出成功提交的任务
                        const validTasks = taskResults.filter(r => r.taskId);
                        
                        if (validTasks.length === 0) {
                            throw new Error('所有请求提交失败');
                        }
                        
                        addLog(`[节点 ${nodeIndex + 1}] ✅ 成功提交 ${validTasks.length}/${node.numImages} 个请求，开始并行轮询...`);
                        
                        // 🔄 并行轮询所有任务，成功立即下载
                        const successResults = [];
                        const failedResults = [];
                        const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
                        let downloadCounter = 0;
                        
                        const pollPromises = validTasks.map((task) => 
                            pollResult(task.taskId, node.id)
                                .then(async (result) => {
                                    // ✅ 成功后立即下载
                                    downloadCounter++;
                                    const imgNumber = downloadCounter;
                                    addLog(`[节点 ${nodeIndex + 1}] ✅ 任务 ${task.index + 1} 生成成功，立即下载...`);
                                    const filename = `node-${nodeIndex + 1}-img${imgNumber}-${timestamp}.jpg`;
                                    await downloadImage(result.url, filename);
                                    
                                    successResults.push(result);
                                    
                                    // 实时更新UI显示图片
                                    setNodes(prevNodes => prevNodes.map((n, idx) =>
                                        idx === nodeIndex ? {
                                            ...n,
                                            results: [...successResults]
                                        } : n
                                    ));
                                    
                                    return { success: true, result, index: task.index };
                                })
                                .catch(error => {
                                    addLog(`[节点 ${nodeIndex + 1}] ❌ 任务 ${task.index + 1} 失败: ${error.message}`);
                                    failedResults.push({ error, index: task.index });
                                    return { success: false, error, index: task.index };
                                })
                        );
                        
                        // ⏳ 等待所有请求都返回结果（成功或失败）
                        addLog(`[节点 ${nodeIndex + 1}] ⏳ 等待所有任务返回结果...`);
                        await Promise.allSettled(pollPromises);
                        
                        const successCount = successResults.length;
                        const failedCount = failedResults.length;
                        
                        addLog(`[节点 ${nodeIndex + 1}] 📊 所有任务已返回: 成功 ${successCount}/${validTasks.length}, 失败 ${failedCount}`);
                        
                        // 🎯 关键判断：有成功 → 完成，全部失败 → 重试
                        if (successCount === 0) {
                            // 全部失败 → 抛出错误，触发重试
                            const errorMessages = failedResults
                                .map(r => r.error?.message || '未知错误')
                                .join(', ');
                            throw new Error(`全部失败，准备重试: ${errorMessages}`);
                        }
                        
                        // ✅ 有成功 → 直接完成，不重试
                        addLog(`[节点 ${nodeIndex + 1}] ✅ 有成功结果，停止并完成节点`);
                        
                        setNodes(prevNodes => prevNodes.map((n, idx) =>
                            idx === nodeIndex ? {
                                ...n,
                                status: 'completed',
                                results: successResults,
                                progress: 100,
                                error: failedCount > 0 ? `部分成功 (${successCount}/${node.numImages})` : '',
                                retryCount
                            } : n
                        ));
                        
                        success = true;
                        const successMsg = failedCount > 0 
                            ? `完成! 成功${successCount}张，失败${failedCount}张` 
                            : `完成! 成功${successCount}张`;
                        addLog(`[节点 ${nodeIndex + 1}] 🎉 ${successMsg}${retryCount > 0 ? ` (重试${retryCount}次)` : ''}`);
                        break;
                        
                    } catch (error) {
                        retryCount++;
                        
                        if (retryCount > maxRetries) {
                            addLog(`[节点 ${nodeIndex + 1}] ❌ 失败: ${error.message} (已重试${maxRetries}次)`);
                            setNodes(prevNodes => prevNodes.map((n, idx) =>
                                idx === nodeIndex ? {
                                    ...n,
                                    status: 'failed',
                                    error: `失败: ${error.message}`,
                                    retryCount: maxRetries
                                } : n
                            ));
                            break;
                        } else {
                            addLog(`[节点 ${nodeIndex + 1}] ⚠️ 错误: ${error.message}，立即重试...`);
                        }
                    }
                }
                
                setIsRunning(false);
                setCurrentRunningNode(null);
                setIsStopping(false);
                stopFlagRef.current = false;
            };

            // 状态显示
            const getStatusColor = (status) => {
                switch (status) {
                    case 'pending': return 'bg-gray-200 text-gray-700';
                    case 'running': return 'bg-blue-500 text-white';
                    case 'completed': return 'bg-green-500 text-white';
                    case 'failed': return 'bg-red-500 text-white';
                    default: return 'bg-gray-200 text-gray-700';
                }
            };

            const getStatusText = (status) => {
                switch (status) {
                    case 'pending': return '等待中';
                    case 'running': return '生成中';
                    case 'completed': return '已完成';
                    case 'failed': return '失败';
                    default: return '未知';
                }
            };

            // 获取可用的输入图片源
            const getAvailableInputImages = (nodeIndex) => {
                if (nodeIndex === 0) return [];
                
                // 收集所有前面节点的结果
                const availableImages = [];
                for (let i = 0; i < nodeIndex; i++) {
                    if (nodes[i].results && nodes[i].results.length > 0) {
                        nodes[i].results.forEach((result, idx) => {
                            availableImages.push({
                                nodeIndex: i,
                                imageIndex: idx,
                                url: result.url,
                                label: `节点${i + 1}-图${idx + 1}`
                            });
                        });
                    }
                }
                
                return availableImages;
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-purple-50 to-blue-50 p-3 sm:p-6">
                    <div className="max-w-6xl mx-auto">
                        {/* 标题 */}
                        <div className="text-center mb-4 sm:mb-8">
                            <div className="flex flex-col sm:flex-row items-center justify-center gap-2 sm:gap-4 mb-2">
                                <h1 className="text-2xl sm:text-4xl font-bold text-gray-800">🍌 Nano Banana V2</h1>
                                <div className="flex gap-2">
                                    <button
                                        onClick={() => setShowDebugLog(!showDebugLog)}
                                        className="px-3 py-1.5 text-xs sm:text-sm bg-gray-200 hover:bg-gray-300 rounded-lg transition-colors touch-manipulation"
                                    >
                                        {showDebugLog ? '🔍 隐藏日志' : '🔍 显示日志'}
                                    </button>
                                    <button
                                        onClick={() => setShowPromptLibrary(true)}
                                        className="px-3 py-1.5 text-xs sm:text-sm bg-purple-200 hover:bg-purple-300 rounded-lg transition-colors touch-manipulation"
                                    >

                                <li>🖼️ 点击任意图片可以放大预览</li>
                                <li>📥 所有生成的图片自动下载到本地</li>
                                <li>🔄 失败后立即重试，可自定义重试次数</li>
                                <li>⏹️ 执行中可随时停止</li>
                            </ul>
                            <div className="mt-3 p-2 sm:p-3 bg-yellow-50 border border-yellow-200 rounded">
                                <p className="text-xs text-yellow-800">
                                    <strong>⚠️ 使用流程：</strong>
                                    1. 上传初始图片 → 2. 执行节点1 → 3. 从节点1的结果中选择图片 → 4. 执行节点2 → 5. 依此类推
                                </p>
                            </div>
                            <div className="mt-2 p-2 sm:p-3 bg-purple-50 border border-purple-200 rounded">
                                <p className="text-xs text-purple-800">
                                    <strong>🚀 并行生成说明：</strong>
                                    选择生成4张时，会一次性发出4个并行请求，同时生成。只有全部失败才会重试（重新发4个请求）。部分成功也算成功。
                                </p>
                            </div>
                        </div>

                        {/* 图片预览模态框 */}
                        {previewImage && (
                            <div 
                                className="fixed inset-0 bg-black bg-opacity-90 z-50 flex items-center justify-center p-4"
                                onClick={() => setPreviewImage(null)}
                            >
                                <div className="relative w-full h-full flex flex-col items-center justify-center">
                                    <button
                                        className="absolute top-2 sm:top-4 right-2 sm:right-4 w-10 h-10 sm:w-12 sm:h-12 text-white bg-black bg-opacity-50 rounded-full flex items-center justify-center text-2xl sm:text-3xl hover:bg-opacity-70 transition-colors z-10 touch-manipulation"
                                        onClick={(e) => {
                                            e.stopPropagation();
                                            setPreviewImage(null);
                                        }}
                                    >
                                        ✕
                                    </button>
                                    
                                    <img
                                        src={previewImage}
                                        alt="预览"
                                        className="max-w-full max-h-full object-contain"
                                        onClick={(e) => e.stopPropagation()}
                                    />
                                    
                                    <div className="absolute bottom-2 sm:bottom-4 left-0 right-0 text-center text-white text-xs sm:text-sm bg-black bg-opacity-50 py-2">
                                        点击图片外区域或右上角 ✕ 关闭预览
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
